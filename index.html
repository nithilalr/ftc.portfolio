
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="FTC Team 37186 Supernova — Engineering Portfolio">
    <meta name="theme-color" content="#090b12">

    <title>FTC 37186 | Supernova</title>

    <style>
        :root {
            --bg: #080a10;
            --bg-soft: #0e111a;
            --card: rgba(20, 24, 35, 0.78);
            --card-solid: #141823;
            --orange: #ff6b00;
            --orange-light: #ff9a3c;
            --blue: #00bfff;
            --text: #f4f7fb;
            --muted: #9da6b8;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 10%, rgba(255,107,0,0.12), transparent 28%),
                radial-gradient(circle at 85% 20%, rgba(0,191,255,0.10), transparent 28%),
                var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ---------- NAVIGATION ---------- */

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(18px);
            background: rgba(8,10,16,0.78);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 1150px;
            margin: auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--orange);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: white;
        }

        /* ---------- HERO ---------- */

        .hero {
            min-height: 82vh;
            max-width: 1150px;
            margin: auto;
            padding: 100px 24px 80px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            gap: 60px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 13px;
            border-radius: 999px;
            border: 1px solid rgba(255,107,0,0.3);
            background: rgba(255,107,0,0.08);

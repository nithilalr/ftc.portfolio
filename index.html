Vectored Wheel Intake
In this iteration we moved the intake rollers over to vectored wheels,
so the angled rollers pull game pieces in more smoothly and keep them
from getting stuck or misaligned at the mouth of the intake. Fig. A
shows the printed pair; Fig. B shows the parts that make up each wheel —
the hub and the individual rollers that press into its circumference.

// AUTO_PHASE.specimen_cycle()
public void runOpMode() {
drive.followTrajectory(toSample);
while (opModeIsActive() && !claw.hasSpecimen()) {
claw.extend();        // closed-loop PID
if (vision.targetLocked()) break;
}
claw.retract();
drive.followTrajectory(toHighBasket);
lift.toPosition(HIGH_RUNG); // 0.0 -> 1.0
claw.release();
}
// TELE_OP.state_machine()
gamepad1.left_stick_y  -> drive.power;
gamepad1.right_stick_x -> drive.turn;
gamepad1.a             -> claw.toggle();
gamepad2.dpad_up       -> lift.step(+0.05);
gamepad2.dpad_down     -> lift.step(-0.05);
// PID: Kp=2.4, Ki=0.02, Kd=0.8
// VISION.lock_target()
aprilTag = detector.detect(frame);
if (aprilTag.id == TARGET_ID) {
double err = aprilTag.center.x - frame.cx;
drive.aim(err * GAIN);  // proportional aim
if (abs(err) < TOL) state = SCORE;
}
